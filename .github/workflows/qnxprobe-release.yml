name: QNXProbe release builds
on:
  push:
    tags:
      - 'v*-qnxprobe.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v4.15.0-qnxprobe.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential ant ivy libsqlite3-dev libssl-dev zlib1g-dev libafflib-dev libewf-dev
      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure --prefix="$PWD/_install"
          make -j2
          make install
      - name: Package binaries and Java bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/linux-x64/bin release/linux-x64/lib release/java
          find _install/bin -maxdepth 1 -type f -exec cp {} release/linux-x64/bin/ \;
          find _install/lib -maxdepth 1 -type f -name '*.so*' -exec cp -L {} release/linux-x64/lib/ \;
          find bindings/java -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -exec cp {} release/java/ \;
          test -n "$(find release/java -name '*.jar' -print -quit)"
          echo 'Java artifacts:'
          find release/java -name '*.jar' -print
          test -n "$(find release/linux-x64/bin -type f -print -quit)"
          tar -czf sleuthkit-linux-x64.tar.gz -C release linux-x64
          (cd release/java && zip -r ../../sleuthkit-java.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-java
          path: |
            sleuthkit-linux-x64.tar.gz
            sleuthkit-java.zip
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build native release
        shell: pwsh
        run: |
          $solution = Get-ChildItem win32 -Filter *.sln | Select-Object -First 1
          if (-not $solution) { throw "No Visual Studio solution in win32" }
          msbuild $solution.FullName /m /p:Configuration=Release /p:Platform=x64
      - name: Package Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows-x64 | Out-Null
          Get-ChildItem win32/x64/Release -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination release/windows-x64
          if (-not (Get-ChildItem release/windows-x64 -Filter *.exe)) { throw "No executables produced" }
          $jni = Get-ChildItem -Path . -Recurse -File -Filter '*sleuthkit*jni*.dll' | Where-Object { $_.FullName -notmatch '[\\/]release[\\/]' }
          if (-not $jni) { $jni = Get-ChildItem -Path . -Recurse -File -Filter '*jni*.dll' | Where-Object { $_.FullName -notmatch '[\\/]release[\\/]' } }
          if (-not $jni) { throw 'JNI DLL missing: Windows build is not a complete Autopsy-compatible release' }
          $jni | Copy-Item -Destination release/windows-x64 -Force
          Write-Host 'JNI DLLs:' ($jni.Name -join ', ')
          Compress-Archive release/windows-x64/* sleuthkit-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sleuthkit-windows-x64.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+-qnxprobe\\.[0-9]+$ ]]; then
            echo 'Invalid release tag. Expected vMAJOR.MINOR.PATCH-qnxprobe.N' >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: artifacts/*
          generate_release_notes: true
